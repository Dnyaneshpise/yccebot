name: AWS Builder Badge Agent

on:
  schedule:
    # Badge tracking + proposals: once daily at 03:30 UTC.
    - cron: "30 3 * * *"
    # Reply polling: every 6 hours so an approval waits at most ~6h.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: propose
        options:
          - propose   # pick articles, send to Telegram for approval
          - execute   # perform only what you already approved
          - inbox     # read approvals/rejections replied to in Telegram
          - progress  # badge tracking only, no proposals

concurrency:
  group: badge-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-agent:
    name: Badge agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Decide mode
        id: mode
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$DISPATCH_MODE" ]; then
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 */6 * * *" ]; then
            echo "mode=inbox" >> "$GITHUB_OUTPUT"
          else
            echo "mode=propose" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the agent
        env:
          AWS_STORAGE_STATE_B64: ${{ secrets.AWS_STORAGE_STATE_B64 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemma-4-26b-a4b-it:free' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          MIN_RELEVANCE: "1"
          MAX_DRAFTS: "3"
          # No genuine signed-in browser exists on a runner, so approved
          # actions are recorded as deferred rather than attempted.
          WRITES_ENABLED: "false"
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            execute)  python -m agent.main --execute ;;
            inbox)    python -m agent.main --inbox ;;
            progress) python -m agent.main --no-draft ;;
            propose)  python -m agent.main --propose ;;
            *)        python -m agent.main --propose ;;
          esac

      - name: Commit progress
        if: steps.mode.outputs.mode != 'inbox'
        run: |
          if git diff --quiet -- data/progress.json; then
            echo "No change to data/progress.json"
            exit 0
          fi
          git config user.name  "badge-agent-bot"
          git config user.email "badge-agent-bot@users.noreply.github.com"
          git add data/progress.json
          git commit -m "chore: badge progress snapshot ($(date -u +%Y-%m-%d))"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}