name: AWS Builder Badge Agent

on:
  schedule:
    # 03:30 UTC daily. GitHub cron is always UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      draft:
        description: "Generate review-only content drafts"
        type: boolean
        default: true

# Only one run at a time, and never cancel a run mid-progress-update.
concurrency:
  group: badge-agent
  cancel-in-progress: false

permissions:
  contents: write # required to commit data/progress.json back to the repo

jobs:
  run-agent:
    name: Track badge progress
    runs-on: ubuntu-latest
    # Give up after 15 minutes so a hung browser never burns the quota.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Run the agent
        env:
          AWS_STORAGE_STATE_B64: ${{ secrets.AWS_STORAGE_STATE_B64 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemma-4-26b-a4b-it:free' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          DRY_RUN: "false"
          MAX_DRAFTS: "3"
          MIN_RELEVANCE: "4"
        run: |
          if [ "${{ inputs.draft }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python -m agent.main --draft
          else
            python -m agent.main --no-draft
          fi

      - name: Commit updated progress
        run: |
          if git diff --quiet -- data/progress.json; then
            echo "No changes to data/progress.json"
            exit 0
          fi
          git config user.name  "badge-agent-bot"
          git config user.email "badge-agent-bot@users.noreply.github.com"
          git add data/progress.json
          git commit -m "chore: update badge progress ($(date -u +%Y-%m-%d))"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}